<main id="main" class="main">

    <div class="pagetitle">
        <h1>Mettre à jour un techno</h1>
        <br />
    </div>

    <section class="section" *ngIf="!isLoading; else loadingTpl">
        <div class="row">
            <div class="col-lg-12">

                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Édition du techno</h5>

                        <form (ngSubmit)="onSubmit()" #technoForm="ngForm">
                            <!-- Titre -->
                            <div class="row mb-3">
                                <label class="col-sm-2 col-form-label">Titre</label>
                                <div class="col-sm-10">
                                    <input type="text" class="form-control" name="titre" [(ngModel)]="titre" required />
                                </div>
                            </div>


                            <!-- Switch mise à jour images -->
                            <div class="row mb-3">
                                <label class="col-sm-2 col-form-label">Mettre à jour l'image</label>
                                <div class="col-sm-10 d-flex align-items-center">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="updateImageSwitch"
                                            name="updateImage" [(ngModel)]="updateImage" />
                                        <label class="form-check-label" for="updateImageSwitch">
                                            Activer si tu veux remplacer l'image de ce techno.
                                            Si désactivé, l'image actuelle sera conservée.
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <!-- Image -->
                            <div class="row mb-3" *ngIf="updateImage">
                                <label class="col-sm-2 col-form-label">Image</label>
                                <div class="col-sm-10">
                                    <div class="mb-2">

                                        <!-- Alt déjà pré-rempli (chargé depuis le techno) -->
                                        <input type="text" class="form-control mb-2"
                                            placeholder="Texte alternatif (alt)" name="image_alt"
                                            [(ngModel)]="image.alt" />

                                        <!-- Fichier à re-sélectionner (toujours vide au chargement) -->
                                        <input class="form-control" type="file"
                                            (change)="onMainImageSelected($event)" />
                                        <small class="text-muted">
                                            Choisis une nouvelle image pour cet élément.
                                            Si tu ne choisis rien, cet élément ne sera pas envoyé.
                                        </small>

                                    </div>
                                </div>
                            </div>

                            
                            
                            <!-- Chapo -->
                            <div class="row mb-3">
                                <label class="col-sm-2 col-form-label">Chapo</label>
                                <div class="col-sm-10">
                                    <textarea class="form-control" name="chapo" [(ngModel)]="chapo" rows="2"
                                    placeholder="Projet de plateforme d’emploi avec moteur de recherche sémantique..."></textarea>
                                </div>
                            </div>
                            
                            <!-- Categorie -->
                            <div class="row mb-3">
                                <label class="col-sm-2 col-form-label">Categorie</label>
                                <div class="col-sm-10">
                                    <input type="text" class="form-control" name="categorie" [(ngModel)]="categorie" />
                                </div>
                            </div>
                           
                            <!-- Messages -->
                            <div class="row mb-3" *ngIf="submitError">
                                <div class="col-sm-12">
                                    <div class="alert alert-danger">
                                        {{ submitError }}
                                    </div>
                                </div>
                            </div>

                            <div class="row mb-3" *ngIf="submitSuccess">
                                <div class="col-sm-12">
                                    <div class="alert alert-success">
                                        {{ submitSuccess }}
                                    </div>
                                </div>
                            </div>

                            <!-- Actions -->
                            <div class="row mb-3">
                                <label class="col-sm-2 col-form-label">Actions</label>
                                <div class="col-sm-10 d-flex gap-2">
                                    <button type="submit" class="btn btn-primary"
                                        [disabled]="isSubmitting || !technoForm.form.valid">
                                        {{ isSubmitting ? 'En cours...' : 'Mettre à jour le techno' }}
                                    </button>
                                    <button type="button" class="btn btn-secondary" (click)="goBack()">
                                        Retour
                                    </button>
                                </div>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </section>

    <ng-template #loadingTpl>
        <section class="section">
            <div class="row">
                <div class="col-lg-12">
                    Chargement du techno en cours...
                </div>
            </div>
        </section>
    </ng-template>

</main>
