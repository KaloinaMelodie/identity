<main id="main" class="main">

    <div class="pagetitle">
        <h1>Créer un techno</h1>
        <br />
    </div>

    <section class="section">
        <div class="row">
            <div class="col-lg-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Nouveau techno</h5>

                        <form (ngSubmit)="onSubmit()" #technoForm="ngForm">
                            <!-- Titre -->
                            <div class="row mb-3">
                                <label class="col-sm-2 col-form-label">Titre</label>
                                <div class="col-sm-10">
                                    <input type="text" class="form-control" name="titre" [(ngModel)]="titre" required />
                                </div>
                            </div>


                            <!-- Image -->
                            <div class="row mb-3">
                                <label class="col-sm-2 col-form-label">Image</label>
                                <div class="col-sm-10">                                    
                                        <div class="mb-2">
                                            <input class="form-control mb-2" type="file"
                                                (change)="onMainImageSelected($event)" />
                                            <input type="text" class="form-control" placeholder="Texte alternatif (alt)"
                                                name="image_alt" [(ngModel)]="image.alt" />
                                        </div>                                    
                                </div>
                            </div>

                          
                           

                            <!-- Chapo -->
                            <div class="row mb-3">
                                <label class="col-sm-2 col-form-label">Chapo</label>
                                <div class="col-sm-10">
                                    <textarea class="form-control" name="chapo" [(ngModel)]="chapo" rows="2"></textarea>
                                </div>
                            </div>

                            <!-- Categorie -->
                            <div class="row mb-3">
                                <label class="col-sm-2 col-form-label">Categorie</label>
                                <div class="col-sm-10">
                                    <input type="text" class="form-control" name="categorie" [(ngModel)]="categorie"/>
                                </div>
                            </div>

                          

                            <!-- Messages -->
                            <div class="row mb-3" *ngIf="submitError">
                                <div class="col-sm-12">
                                    <div class="alert alert-danger">
                                        {{ submitError }}
                                    </div>
                                </div>
                            </div>

                            <div class="row mb-3" *ngIf="submitSuccess">
                                <div class="col-sm-12">
                                    <div class="alert alert-success">
                                        {{ submitSuccess }}
                                    </div>
                                </div>
                            </div>

                            <!-- Submit -->
                            <div class="row mb-3">
                                <label class="col-sm-2 col-form-label">Créer</label>
                                <div class="col-sm-10">
                                    <button type="submit" class="btn btn-primary"
                                        [disabled]="isSubmitting || !technoForm.form.valid">
                                        {{ isSubmitting ? 'En cours...' : 'Créer le techno' }}
                                    </button>
                                </div>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </section>

</main>
