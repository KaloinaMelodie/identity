<main id="main" class="main">

    <div class="pagetitle">
        <h1>Mettre à jour un experience</h1>
        <br />
    </div>

    <section class="section" *ngIf="!isLoading; else loadingTpl">
        <div class="row">
            <div class="col-lg-12">

                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Édition du experience</h5>

                        <form (ngSubmit)="onSubmit()" #experienceForm="ngForm">
                            <!-- Titre -->
                            <div class="row mb-3">
                                <label class="col-sm-2 col-form-label">Titre</label>
                                <div class="col-sm-10">
                                    <input type="text" class="form-control" name="titre" [(ngModel)]="titre" required />
                                </div>
                            </div>

                            <!-- Organisation -->
                            <div class="row mb-3">
                                <label class="col-sm-2 col-form-label">Organisation</label>
                                <div class="col-sm-10">
                                    <input type="text" class="form-control" name="organisation" [(ngModel)]="organisation" required />
                                </div>
                            </div>


                            <!-- Rang -->
                            <div class="row mb-3">
                                <label class="col-sm-2 col-form-label">Rang</label>
                                <div class="col-sm-10">
                                    <input type="text" class="form-control" name="rang" [(ngModel)]="rang" required />
                                </div>
                            </div>

                         

                            <!-- Date début -->
                            <div class="row mb-3">
                                <label class="col-sm-2 col-form-label">Date début</label>
                                <div class="col-sm-10">
                                    <input type="text" class="form-control" name="datedebut" [(ngModel)]="datedebut"
                                        placeholder="09/2024 ou 01/09/2024" />
                                </div>
                            </div>

                            <!-- Date fin -->
                            <div class="row mb-3">
                                <label class="col-sm-2 col-form-label">Date fin</label>
                                <div class="col-sm-10">
                                    <input type="text" class="form-control" name="datefin" [(ngModel)]="datefin"
                                        placeholder="laisser vide si en cours" />
                                </div>
                            </div>


                            <!-- Chapo -->
                            <div class="row mb-3">
                                <label class="col-sm-2 col-form-label">Chapo</label>
                                <div class="col-sm-10">
                                    <textarea class="form-control" name="chapo" [(ngModel)]="chapo" rows="2"
                                        placeholder="Experience de plateforme d’emploi avec moteur de recherche sémantique..."></textarea>
                                </div>
                            </div>

                            <!-- Contenu (CKEditor) -->
                            <div class="row mb-3">
                                <label class="col-sm-2 col-form-label">Contenu</label>
                                <div class="col-sm-10">
                                    <ckeditor [editor]="Editor" name="contenu" [(ngModel)]="contenu" [config]="{
                      placeholder: 'Décris ton experience ici en détail...'
                    }"></ckeditor>
                                    <small class="text-muted">
                                        Le contenu est enregistré en HTML dans la base (champ <code>contenu</code>).
                                    </small>
                                </div>
                            </div>

                            <!-- Liens -->
                            <div class="row mb-3">
                                <label class="col-sm-2 col-form-label">Liens</label>
                                <div class="col-sm-10">
                                    <div *ngFor="let lien of liens; let i = index" class="mb-3 border rounded p-2">
                                        <div class="mb-2">
                                            <input type="text" class="form-control mb-2" placeholder="URL du lien"
                                                name="lien_{{ i }}" [(ngModel)]="lien.lien" />
                                            <input type="text" class="form-control" placeholder="Titre du lien"
                                                name="lien_titre_{{ i }}" [(ngModel)]="lien.titre" />
                                        </div>
                                        <button type="button" class="btn btn-outline-danger btn-sm"
                                            (click)="removeLink(i)" *ngIf="liens.length > 1">
                                            Supprimer ce lien
                                        </button>
                                    </div>
                                    <button type="button" class="btn btn-outline-primary btn-sm" (click)="addLink()">
                                        Ajouter un lien
                                    </button>
                                </div>
                            </div>
                           
                            <!-- Messages -->
                            <div class="row mb-3" *ngIf="submitError">
                                <div class="col-sm-12">
                                    <div class="alert alert-danger">
                                        {{ submitError }}
                                    </div>
                                </div>
                            </div>

                            <div class="row mb-3" *ngIf="submitSuccess">
                                <div class="col-sm-12">
                                    <div class="alert alert-success">
                                        {{ submitSuccess }}
                                    </div>
                                </div>
                            </div>

                            <!-- Actions -->
                            <div class="row mb-3">
                                <label class="col-sm-2 col-form-label">Actions</label>
                                <div class="col-sm-10 d-flex gap-2">
                                    <button type="submit" class="btn btn-primary"
                                        [disabled]="isSubmitting || !experienceForm.form.valid">
                                        {{ isSubmitting ? 'En cours...' : 'Mettre à jour le experience' }}
                                    </button>
                                    <button type="button" class="btn btn-secondary" (click)="goBack()">
                                        Retour
                                    </button>
                                </div>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </section>

    <ng-template #loadingTpl>
        <section class="section">
            <div class="row">
                <div class="col-lg-12">
                    Chargement du experience en cours...
                </div>
            </div>
        </section>
    </ng-template>

</main>
