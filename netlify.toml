[build]
  command = """
    npm ci &&
    npm run build -- --configuration=production &&
    BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M:%S UTC')" &&
    sed -i "s/BUILD_TIMESTAMP_PLACEHOLDER/$BUILD_TIME/" dist/identity/browser/index.html
  """
  publish = "dist/identity/browser"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200