server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ================================
    # STATIC FILE CACHING
    # ================================

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ================================
    # INDEX (NO CACHE)
    # ================================

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ================================
    # ANGULAR ROUTING
    # ================================

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ================================
    # GZIP
    # ================================

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;
}